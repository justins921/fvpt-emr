version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: fvpt-emr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fvpt_emr
      POSTGRES_USER: emr
      POSTGRES_PASSWORD: ${DB_PASSWORD:-emr_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emr -d fvpt_emr"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: fvpt-emr-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://emr:${DB_PASSWORD:-emr_dev_password}@db:5432/fvpt_emr
      # SECURITY: These have no defaults. Compose will refuse to start with a
      # clear error if they are not set in your .env file. Generate with:
      #   openssl rand -hex 64
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 64)}
      PHI_ENCRYPTION_KEY: ${PHI_ENCRYPTION_KEY:?Set PHI_ENCRYPTION_KEY in .env (openssl rand -hex 64)}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://emr.local,https://${HOSTNAME:-localhost}}
      TRUST_PROXY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then(r => { if (!r.ok) process.exit(1) })\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: fvpt-emr-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

  caddy:
    image: caddy:2-alpine
    container_name: fvpt-emr-caddy
    restart: unless-stopped
    depends_on:
      - server
      - client
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
